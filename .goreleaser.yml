project_name: pokedex
before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: pokedex
    main: ./cmd/pokedex
    binary: pokedex
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch
        | replace "amd64" "x86_64"
        | replace "arm64" "aarch64" -}}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksums:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256
  disable: false

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: ""
    name: ""
  prerelease: auto
  draft: false
  name_template: "Release {{.Tag}}"
  footer: |
    ## Thank you!
    Those were the changes on {{.Tag}}!
